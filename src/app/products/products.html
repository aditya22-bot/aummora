<div class="amurra-product-section">
  <app-product-categories></app-product-categories>
</div>

<section class="stats-section">
  <div class="stats-container">
    <!-- Countries -->
    <div class="stat-item">
      <div class="stat-icon">
        <img src="assets/icons/worldwide.png" alt="Countries" />
      </div>

      <div class="stat-text">
        <h2>{{ countries }}+</h2>
        <h4>Countries Served</h4>
        <p>Across 4 Continents</p>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Products -->
    <div class="stat-item">
      <div class="stat-icon">
        <img src="assets/icons/worldwide.png" alt="Products" />
      </div>

      <div class="stat-text">
        <h2>{{ products }}+</h2>
        <h4>Products</h4>
        <p>Diverse Range</p>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Clients -->
    <div class="stat-item">
      <div class="stat-icon">
        <img src="assets/icons/worldwide.png" alt="Clients" />
      </div>

      <div class="stat-text">
        <h2>{{ clients }}+</h2>
        <h4>Happy Clients</h4>
        <p>Worldwide</p>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Shipments -->
    <div class="stat-item">
      <div class="stat-icon">
        <img src="assets/icons/worldwide.png" alt="Shipments" />
      </div>

      <div class="stat-text">
        <h2>{{ shipments }}+</h2>
        <h4>Shipments</h4>
        <p>Delivered Successfully</p>
      </div>
    </div>
  </div>
</section>

<div class="aumoora-fotter"><app-footer></app-footer></div>
