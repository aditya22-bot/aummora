<header class="aumorra-header">
  <div class="container">
    <!-- Logo -->
    <div class="logo">
      <a routerLink="/">
        <img src="assets/icons/logo.png" alt="Aumorra Logo" class="logo-img" />
      </a>
    </div>

    <!-- Navigation -->
    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Home
      </a>

      <a routerLink="/about" routerLinkActive="active"> About Us </a>

      <a routerLink="/products" routerLinkActive="active"> Products </a>

      <a routerLink="/services" routerLinkActive="active"> Services </a>
      <a routerLink="/csr" routerLinkActive="active"> CSR </a>
      <a routerLink="/careers" routerLinkActive="active"> Careers </a>
      <a routerLink="/why-choose-us" routerLinkActive="active"> Why Choose Us </a>
      <a routerLink="/contact-us" routerLinkActive="active"> Contact Us </a>
    </nav>

    <!-- Right Button -->
    <div class="header-action">
      <a routerLink="/contact-us" class="quote-btn">
        Get a Quote
        <span>→</span>
      </a>
    </div>
  </div>
</header>

<router-outlet></router-outlet>
