<section class="export-section">
  <div class="section-header">
    <div class="sub-title">
      <span>WHAT WE EXPORT</span>
      <div class="line"></div>
    </div>

    <h2>Premium Products. Global Standards.</h2>
  </div>

  <div class="category-container">
    @for (item of categories; track item.id) {
      <div class="card" (click)="goToCategory(item.id)">
        <div class="image-box">
          <img [src]="item.image" [alt]="item.name" />

          <div class="icon-box">
            <img [src]="item.icon" [alt]="item.name" />
          </div>
        </div>

        <div class="content">
          <h3>{{ item.name }}</h3>

          <span class="arrow">→</span>
        </div>
      </div>
    }
  </div>

  <div class="view-btn">
    <a routerLink="/products"> View All Products → </a>
  </div>
</section>
