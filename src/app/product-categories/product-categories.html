<div class="category-container">
  @for (item of categories; track item.id) {
    <div class="card" (click)="goToCategory(item.id)">
      <!-- Image -->
      <div class="image-box">
        <img [src]="item.image" />
      </div>

      <!-- Content -->
      <div class="content">
        <h3>{{ item.name }}</h3>
        <p>Explore products</p>
      </div>
    </div>
  }
</div>
